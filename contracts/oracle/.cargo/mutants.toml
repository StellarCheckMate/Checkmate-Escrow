# cargo-mutants configuration for the oracle contract.
# See https://mutants.rs/ and docs/mutation-test-report.md
#
# Run from the workspace root:
#   ./scripts/mutation_test.sh oracle
# or:
#   cargo mutants -p oracle --config contracts/oracle/.cargo/mutants.toml

examine_globs = [
    "**/src/lib.rs",
    "**/src/errors.rs",
    "**/src/types.rs",
]

exclude_globs = [
    "**/src/tests.rs",
    "**/tests/**",
]

skip_calls = [
    "require_auth",
    "extend_instance_ttl",
    "extend_ttl",
    "publish",
    "clone",
]

# Skip the known pre-existing integration failure until claim/vesting expectations
# are aligned with escrow payout semantics.
additional_cargo_test_args = [
    "--lib",
    "--",
    "--skip", "test_oracle_to_escrow_full_payout_flow",
]

timeout_multiplier = 2.0
minimum_test_timeout = 60
cap_lints = true
