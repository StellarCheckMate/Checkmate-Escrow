# cargo-mutants configuration for the escrow contract.
# See https://mutants.rs/ and docs/mutation-test-report.md
#
# Run from the workspace root:
#   ./scripts/mutation_test.sh
# or:
#   cargo mutants -p escrow --config contracts/escrow/.cargo/mutants.toml

# Only mutate production contract sources (not formal-verification / test harnesses).
# Globs are matched against workspace-relative paths (e.g. contracts/escrow/src/lib.rs).
examine_globs = [
    "**/src/lib.rs",
    "**/src/errors.rs",
    "**/src/types.rs",
]

exclude_globs = [
    "**/src/tests/**",
    "**/src/formal_verification*.rs",
    "**/src/kani_harness.rs",
    "**/tests/**",
]

# Skip noisy / low-value call-site mutations.
skip_calls = [
    "require_auth",
    "extend_instance_ttl",
    "extend_ttl",
    "publish",
    "clone",
    "to_string",
]

# Equivalent / unreachable boundary mutants:
# - `> 0` → `>= 0` on non-negative fee amounts does not change transfers when fee is 0
# - `token_b.is_some() && rate > 0` → `||` is equivalent for reachable create_match states
exclude_re = [
    "replace > with >= in EscrowContract::cancel_match",
    "replace && with \\|\\| in EscrowContract::cancel_match",
]

# Baseline excludes known pre-existing failures unrelated to mutation quality
# (vesting/claim migration gaps, budget-limit stress tests, kani harness stubs).
# Revisit this list as those tests are repaired.
additional_cargo_test_args = [
    "--lib",
    "--",
    "--skip", "kani_harness",
    "--skip", "test_dispute_bond_refunded_on_overturn",
    "--skip", "test_resolve_dispute_upholds_oracle_result",
    "--skip", "test_vote_on_dispute_uptake_by_stakers",
    "--skip", "test_active_pagination_handles_empty_and_partial_pages",
    "--skip", "test_full_lifecycle_draw_refund",
    "--skip", "test_full_lifecycle_winner_payout",
    "--skip", "test_escrow_balance_tracks_deposits_exactly",
    "--skip", "test_concurrent_matches_remain_isolated",
    "--skip", "test_deposit_fails_on_paused_match",
    "--skip", "test_expire_match_refunds_both_players_when_both_deposited_but_still_pending",
    "--skip", "test_multiple_pause_resume_cycles",
    "--skip", "test_submit_result_fails_when_contract_token_balance_is_zero",
    "--skip", "test_submit_result_overflow_on_extreme_stake",
    "--skip", "test_multi_token_deposits_and_refunds",
    "--skip", "test_multi_token_payout_draw",
    "--skip", "test_multi_token_payout_fund_conservation",
    "--skip", "test_multi_token_payout_player1_wins",
    "--skip", "test_multi_token_payout_player2_wins",
    "--skip", "test_balance_history_across_multiple_matches",
    "--skip", "test_submit_result_zeroes_player_balance_in_history",
    "--skip", "test_accept_admin_wrong_caller_rejected",
    "--skip", "test_security_payout_overflow_prevention",
    "--skip", "test_active_matches_read_extends_ttl_after_ledger_advancement",
    "--skip", "test_active_matches_ttl_refreshed_on_append_and_removal",
]

# Give Soroban tests headroom relative to the unmutated baseline.
timeout_multiplier = 2.0
minimum_test_timeout = 60

# Cap lint noise from mutants that trigger dead_code / unused warnings.
cap_lints = true
