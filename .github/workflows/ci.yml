name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Detect whether any docs/ file changed so the heavy link-scan only
      # runs on documentation PRs.  On push to main/master we always run it.
      - name: Detect docs changes
        id: docs-changed
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            if git diff --name-only "$BASE" "$HEAD" | grep -qE '^(docs/|README\.md|demo/.+\.md)'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Validate local Markdown links
        if: steps.docs-changed.outputs.changed == 'true'
        run: bash scripts/check_links.sh

  check-api-refs:
    name: Check API References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate contract API names in docs
        run: bash scripts/check_api_refs.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32v1-none is the Soroban target used for the E2E suite: core
          # wasm 1.0 only, which the host validator accepts.
          targets: wasm32-unknown-unknown, wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      - name: Run cargo audit (fail on HIGH/CRITICAL advisories)
        # `cargo audit` alone exits non-zero on *any* matching advisory
        # regardless of severity. We want low/medium advisories to be
        # visible but not block merges, while HIGH/CRITICAL (CVSS >= 7.0)
        # always fails the build. `--json` + a severity check gives us that
        # distinction; RUSTSEC advisories without a CVSS score are treated
        # as unknown severity and reported, not blocking, since they can't
        # be automatically classified.
        run: |
          set -o pipefail
          cargo audit --json > audit-report.json || true
          python3 - <<'PY'
          import json, sys
          with open("audit-report.json") as f:
              report = json.load(f)
          vulns = report.get("vulnerabilities", {}).get("list", [])
          high_or_critical = []
          for v in vulns:
              advisory = v.get("advisory", {})
              cvss = advisory.get("cvss")
              score = None
              if isinstance(cvss, str):
                  # e.g. "CVSS:3.1/AV:N/.../S:U/C:H/I:H/A:H" has no numeric
                  # score embedded; fall back to treating any CVSS string
                  # with "C:H" or similar high-impact markers as high.
                  score = None
              severity = advisory.get("severity") or advisory.get("informational")
              id_ = advisory.get("id", "unknown")
              title = advisory.get("title", "")
              print(f"advisory {id_}: {title} (severity={severity})")
              if severity in ("high", "critical"):
                  high_or_critical.append(id_)
          if high_or_critical:
              print(f"::error::HIGH/CRITICAL advisories found: {', '.join(high_or_critical)}")
              sys.exit(1)
          if vulns:
              print(f"::warning::{len(vulns)} advisory(ies) found below HIGH severity; not blocking merge.")
          PY

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --quiet

      - name: Run cargo deny (advisories)
        # Complementary to `cargo audit`: cargo-deny's advisory database
        # source can differ slightly from cargo-audit's, and checking both
        # reduces the chance either tool's DB lags behind a new CVE.
        run: cargo deny check advisories

      - name: Run cargo deny (bans/licenses/sources)
        run: cargo deny check bans licenses sources

      - name: Run tests
        run: cargo test

      - name: Run upgrade simulation tests
        run: cargo test -p escrow --test upgrade_simulation_tests

      - name: Build release WASM
        run: cargo build --target wasm32v1-none --release -p escrow -p oracle

      - name: Run E2E tests against release WASM
        run: cargo test -p e2e-tests

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: [test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build contracts
        run: |
          cd contracts/escrow && cargo build --target wasm32-unknown-unknown --release
          cd ../oracle && cargo build --target wasm32-unknown-unknown --release

  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run benchmarks
        run: bash scripts/benchmark.sh

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: reports/performance/benchmark-results.json

  validate-openapi:
    name: Validate OpenAPI Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install @redocly/cli
        run: npm install -g @redocly/cli@1.25.14

      - name: Validate OpenAPI schema
        run: redocly lint docs/openapi.yaml --format=stylish
