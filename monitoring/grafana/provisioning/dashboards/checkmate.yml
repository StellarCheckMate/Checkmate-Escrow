# Grafana dashboard provisioning
#
# Place this file at grafana/provisioning/dashboards/checkmate.yml

apiVersion: 1

providers:
  - name: Checkmate-Escrow
    orgId: 1
    folder: Checkmate
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
